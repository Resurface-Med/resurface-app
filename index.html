<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Resurface</title>
    <!-- The card a shared link shows in WhatsApp, iMessage and the rest
         (2026-10-26): "Share Resurface" sends the link alone, so this is
         what the friend reads. -->
    <meta name="description" content="Revision questions made from your lectures. Ready-made decks for ARU medicine, or turn your own notes and Ankis into SBA questions." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Resurface" />
    <meta property="og:url" content="https://app.tryresurface.com/" />
    <meta property="og:title" content="Resurface" />
    <meta property="og:description" content="Revision questions made from your lectures. Ready-made decks for ARU medicine, or turn your own notes and Ankis into SBA questions." />
    <meta property="og:image" content="https://app.tryresurface.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#3562f5" id="theme-color-meta" />
    <meta name="color-scheme" content="light dark" />
    <!-- Added to the home screen it runs without browser chrome, which is how
         a study app gets used on a phone between lectures. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Resurface" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Books on a white tile rather than a transparent one: the mark is blue,
         and transparency would leave blue on a dark tab strip. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function() {
        try {
          /* Keep in step with src/lib/themes.js. The test checks both. */
          var alias = { "teal": "sea", "rose": "pink", "orange": "red" };
          var fields = { "light": "#3562f5", "dark": "#0b1220", "indigo": "#6851ff", "sea": "#007b89", "green": "#00822f", "red": "#e00700", "pink": "#d2009a", "purple": "#9c2bff" };
          function ch(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
          function lightField(hex) {
            var n = parseInt(hex.slice(1), 16);
            var L = 0.2126 * ch(n >> 16) + 0.7152 * ch((n >> 8) & 255) + 0.0722 * ch(n & 255);
            return (1.05 / (L + 0.05)) < 4.6;
          }
          var t = localStorage.getItem('pq_theme') || 'light';
          if (alias[t]) t = alias[t];
          var custom = localStorage.getItem('pq_theme_color') || '';
          var meta = document.getElementById('theme-color-meta');
          var root = document.documentElement;
          if (t === 'custom' && /^#[0-9a-fA-F]{6}$/.test(custom)) {
            custom = custom.toLowerCase();
            var light = lightField(custom);
            root.setAttribute('data-theme', 'custom');
            root.setAttribute('data-field', light ? 'light' : 'dark');
            root.style.setProperty('--c-bg', custom);
            root.style.setProperty('--c-body-bg', custom);
            if (light) {
              root.style.setProperty('--c-on-field', '#1c1420');
              root.style.setProperty('--c-on-field-soft', 'rgba(28, 20, 32, 0.82)');
              root.style.setProperty('--c-on-field-faint', 'rgba(28, 20, 32, 0.64)');
            }
            if (meta) meta.content = custom;
          } else {
            if (!fields[t]) t = 'light';
            root.setAttribute('data-theme', t);
            if (lightField(fields[t])) root.setAttribute('data-field', 'light');
            if (meta) meta.content = fields[t];
          }
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
