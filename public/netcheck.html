<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Resurface · network check</title>
<!--
  What this is for.

  On a filtered network — eduroam, a hospital wifi, a school — "the app
  doesn't work" can mean five different things, and they are not fixed the
  same way. The app is static files from one host, but it signs you in
  against another, generates against a third, and signs you in with Google
  against a fourth. Any one of those can be blocked while the rest are fine,
  and the symptom in the app looks much the same.

  So this asks each of them separately and says which answered.

  Everything here is deliberately dependency-free and inline: if a filter is
  stripping scripts or blocking a CDN, a checker that needs one tells you
  nothing. If this page itself will not load, that is already the answer —
  the app's own domain is being blocked.

  Reachability only. A no-cors request cannot read a response, but it can
  tell the difference between "answered" and "did not", which is the only
  thing in question. A host that hangs until the timeout is the signature of
  a filter black-holing it rather than refusing it, so the two are reported
  differently.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 28px 20px 60px; background: #3562f5; color: #fff;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -.4px; }
  p.sub { margin: 0 0 22px; opacity: .8; font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { background: #fff; color: #0f1b3d; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .top { display: flex; align-items: baseline; gap: 10px; }
  .host { font-weight: 650; font-size: 15px; }
  .ms { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .55; font-size: 13px; }
  .what { font-size: 13px; opacity: .7; margin-top: 3px; }
  .verdict { font-weight: 650; font-size: 13px; margin-top: 8px; }
  .ok { color: #1f9d55; } .bad { color: #d12b2b; } .slow { color: #b25e00; }
  .pending { opacity: .5; }
  #summary { background: rgba(255,255,255,.14); border-radius: 14px; padding: 16px;
             margin-bottom: 18px; font-size: 14.5px; min-height: 22px; }
  button { font: inherit; font-weight: 600; padding: 11px 18px; border: 0; border-radius: 999px;
           background: #fff; color: #3562f5; cursor: pointer; margin-top: 8px; }
  code { background: rgba(255,255,255,.16); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Network check</h1>
  <p class="sub">Run this on the network that is giving you trouble. It asks each host the app needs, one at a time.</p>

  <div id="summary">Checking…</div>
  <ul id="list"></ul>
  <button onclick="location.reload()">Run again</button>
  <p class="sub" style="margin-top:18px">
    Will not load on <code>app.tryresurface.com</code>? Open
    <code>resurface-app.vercel.app/netcheck.html</code> instead.
  </p>
</main>

<script>
/*
 * Each check proves the real server answered, not merely that something did.
 * A campus filter can answer in a blocked site's place with its own page, and
 * a check that only asks "did anything reply" calls that reachable. So each
 * one reads something only the real host would send: a JSON body, a CORS
 * reply from our own backend, an image that actually decodes.
 *
 * Absolute URLs throughout, so the page tests the same hosts whether it was
 * opened on app.tryresurface.com or on resurface-app.vercel.app — the second
 * is the one to use if the first will not load. The ?nc on each URL tells the
 * app's service worker to stay out of it, or a cached copy would pass.
 */
var SUPABASE = "https://uhqpljteohitvytwfadp.supabase.co";
var KEY = "sb_publishable_0ZlQhc0Gn_bD5-AFIgPOrw_xKVHv8hJ";
function nc(u) { return u + (u.indexOf("?") < 0 ? "?" : "&") + "nc=" + Date.now(); }

function jsonHas(url, field, opts) {
  return fetch(nc(url), Object.assign({ cache: "no-store" }, opts || {})).then(function (r) {
    return r.json().then(function (j) { return j && field in j; }, function () { return false; });
  });
}
function backend(base) {
  /* Our backend answers an unsigned POST with 401 and a JSON error, and its
     CORS reply names this page's origin. A filter's page does neither. */
  return fetch(nc(base + "/api/generate"), { method: "POST", cache: "no-store",
    headers: { "content-type": "application/json" }, body: "{}" })
    .then(function (r) { return r.json().then(function (j) { return r.status === 401 && "error" in j; }, function () { return false; }); });
}
function image(url) {
  return new Promise(function (resolve) {
    var img = new Image();
    img.onload = function () { resolve(img.naturalWidth > 0); };
    img.onerror = function () { resolve(false); };
    img.src = nc(url);
  });
}

var TARGETS = [
  { host: "uhqpljteohitvytwfadp.supabase.co", what: "Sign-in and every piece of your data",
    sym: "you cannot sign in and nothing saves",
    run: function () { return jsonHas(SUPABASE + "/auth/v1/settings", "external", { headers: { apikey: KEY } }); } },
  { host: "app.tryresurface.com", what: "The app — fresh loads and its images",
    sym: "a reload fails, and images like the Resurface AI mark do not appear",
    run: function () { return jsonHas("https://app.tryresurface.com/manifest.webmanifest", "name"); } },
  { host: "app.tryresurface.com (image)", what: "An image from the app, as the AI button loads it",
    sym: "the Resurface AI mark is broken",
    run: function () { return image("https://app.tryresurface.com/icon-192.png"); } },
  { host: "api.tryresurface.com", what: "Generating questions, and Resurface AI",
    sym: "Generate and Ask fail — unless the fallback below is reachable",
    run: function () { return backend("https://api.tryresurface.com"); } },
  { host: "resurface-app.vercel.app", what: "The app's second address",
    sym: "no way round a blocked app.tryresurface.com",
    run: function () { return jsonHas("https://resurface-app.vercel.app/manifest.webmanifest", "name"); } },
  { host: "resurface-backend-resurface.vercel.app", what: "The API's second address — the app falls back to it",
    sym: "no way round a blocked api.tryresurface.com",
    run: function () { return backend("https://resurface-backend-resurface.vercel.app"); } },
  { host: "accounts.google.com", what: "Signing in with Google",
    sym: "Continue with Google goes nowhere",
    run: function () { return fetch("https://accounts.google.com/generate_204", { mode: "no-cors", cache: "no-store" }).then(function () { return true; }); } },
  { host: "fonts.googleapis.com", what: "The typeface",
    sym: "the app works but looks wrong",
    run: function () { return fetch("https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) { return /@font-face/.test(t); }); } }
];

var TIMEOUT = 6000;

function probe(t) {
  var started = Date.now();
  return new Promise(function (resolve) {
    var done = false;
    function end(state, note) {
      if (done) return;
      done = true; clearTimeout(timer);
      resolve({ state: state, ms: Date.now() - started, note: note });
    }
    var timer = setTimeout(function () {
      end("blocked", "no answer in " + (TIMEOUT / 1000) + "s — the signature of a filter swallowing it");
    }, TIMEOUT);
    t.run().then(function (real) {
      if (real) end("ok", "the real server answered");
      else end("impostor", "something answered, but not the real server — a filter's block page, most likely");
    }, function (e) {
      end("refused", "refused straight away (" + (e && e.message ? e.message : "network error") + ")");
    });
  });
}

var list = document.getElementById("list");
var summary = document.getElementById("summary");
var results = [];

TARGETS.forEach(function (t) {
  var li = document.createElement("li");
  li.className = "pending";
  li.innerHTML = '<div class="top"><span class="host"></span><span class="ms">…</span></div>' +
                 '<div class="what"></div><div class="verdict"></div>';
  li.querySelector(".host").textContent = t.host;
  li.querySelector(".what").textContent = t.what;
  list.appendChild(li);
  t._li = li;
});

(function run() {
  var queue = TARGETS.slice();
  function next() {
    var t = queue.shift();
    if (!t) return finish();
    probe(t).then(function (r) {
      t._li.className = "";
      t._li.querySelector(".ms").textContent = r.ms + "ms";
      var v = t._li.querySelector(".verdict");
      v.className = "verdict " + (r.state === "ok" ? "ok" : r.state === "refused" ? "slow" : "bad");
      var word = { ok: "Reachable — ", refused: "Refused — ", blocked: "Blocked — ", impostor: "Filtered — " }[r.state];
      v.textContent = word + r.note + (r.state !== "ok" ? ". Then: " + t.sym + "." : "");
      results.push({ host: t.host, state: r.state });
      next();
    });
  }
  next();
})();

function finish() {
  var bad = results.filter(function (r) { return r.state !== "ok"; });
  if (!bad.length) {
    summary.innerHTML = "Everything the app needs is reachable from this network. " +
      "If it still misbehaves here, it is not the network blocking a host.";
    return;
  }
  summary.innerHTML = "<strong>" + bad.length + " of " + results.length +
    " unreachable:</strong> " + bad.map(function (r) { return r.host; }).join(", ") +
    ". Screenshot this whole page and send it — the list below says what each one breaks.";
}
</script>
</body>
</html>
