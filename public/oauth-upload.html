<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Add a picture</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Where a picture from a Claude chat gets onto a question (2026-11-06).

  Claude cannot hand a file from the chat to the connector, so its
  image_upload_link tool gives the person a link here, with the question id,
  place and caption after the #. The page uses the person's own saved login
  (same origin as the app), stores the picture in their folder of
  question-images and adds it to the question, exactly as Add a picture in
  the app does. Outside the React bundle like the consent page, so shipping
  it changes nothing for students; /oauth/ is skipped by the service worker.
-->
<style>
  :root {
    --bg: #eef2fb; --card: #fff; --text: #0f1b3d; --muted: #8a93ae; --accent: #3562f5;
    --border: rgba(15, 27, 61, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1220; --card: #131c2e; --text: #e8eef8; --muted: #8b9bb4; --border: rgba(160, 180, 220, 0.14); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: clamp(18px, 5vw, 40px); background: var(--bg); color: var(--text);
    font-family: Poppins, system-ui, sans-serif;
  }
  .np {
    width: min(500px, 100%); background: var(--card); border-radius: 24px;
    padding: clamp(28px, 5vw, 44px); box-shadow: 0 24px 60px rgba(12, 22, 56, 0.16);
  }
  .np__brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .np__brand img { height: 28px; }
  .np__title { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.5px; }
  .np__sub { margin: 8px 0 0; font-size: 14.5px; line-height: 1.5; color: var(--muted); }
  .np__list { margin: 22px 0 0; padding: 0; list-style: none; font-size: 14.5px; line-height: 1.5; }
  .np__list li { padding: 10px 0; border-top: 1px solid var(--border); }
  .np__row { display: flex; align-items: center; gap: 12px; margin-top: 34px; }
  .np__save {
    flex: 1; padding: 13px 20px; border: 0; border-radius: 999px; background: var(--accent); color: #fff;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .np__save:disabled { opacity: 0.5; cursor: default; }
  .np__skip { border: 0; background: none; padding: 8px 6px; font: inherit; font-size: 14.5px; color: var(--muted); cursor: pointer; }
  .np__skip:hover { color: var(--text); }
  .np__who { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .drop {
    display: block; margin-top: 22px; border: 1.5px dashed var(--muted); border-radius: 18px; padding: 34px 18px;
    text-align: center; font-size: 14.5px; color: var(--muted); cursor: pointer;
  }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop img { max-width: 100%; max-height: 260px; border-radius: 12px; display: block; margin: 0 auto; }
  .np__q { margin: 14px 0 0; font-weight: 500; font-size: 14.5px; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="np" aria-live="polite">
  <div class="np__brand"><img id="logo" src="/logo-lockup.png" alt="Resurface"></div>

  <section id="loading"><p class="np__sub">One moment…</p></section>

  <section id="signin" hidden>
    <h1 class="np__title">Sign in to Resurface first</h1>
    <p class="np__sub">Open Resurface in this browser and sign in, then come back to this tab and press Try again.</p>
    <div class="np__row">
      <button class="np__save" id="retry" type="button">Try again</button>
      <a class="np__skip" href="/" target="_blank" rel="noopener">Open Resurface</a>
    </div>
  </section>

  <section id="ask" hidden>
    <h1 class="np__title">Add a picture</h1>
    <p class="np__sub" id="where"></p>
    <p class="np__q" id="question"></p>
    <label class="drop" id="drop">
      <span id="dropText">Drop the picture here, paste it, or click to choose it</span>
      <img id="preview" alt="" hidden>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    </label>
    <div class="np__row">
      <button class="np__save" id="save" type="button" disabled>Add picture</button>
    </div>
    <p class="np__who" id="err"></p>
  </section>

  <section id="done" hidden>
    <h1 class="np__title" id="doneTitle">Done</h1>
    <p class="np__sub" id="doneText">You can close this tab.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/dist/umd/supabase.js"></script>
<script>
(async () => {
  const URL_ = "https://uhqpljteohitvytwfadp.supabase.co";
  const KEY = "sb_publishable_0ZlQhc0Gn_bD5-AFIgPOrw_xKVHv8hJ";
  const BUCKET = "question-images";
  const TYPES = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp" };
  const MAX = 4 * 1024 * 1024;
  const $ = id => document.getElementById(id);
  const show = id => { for (const s of ["loading", "signin", "ask", "done"]) $(s).hidden = s !== id; };
  const finish = (title, text) => { $("doneTitle").textContent = title; $("doneText").textContent = text; show("done"); };

  if (matchMedia("(prefers-color-scheme: dark)").matches) $("logo").src = "/logo-lockup-white.png";

  const args = new URLSearchParams(location.hash.slice(1));
  const qid = Number(args.get("q"));
  const place = args.get("place");
  const caption = (args.get("caption") || "").replace(/[[\]\n]/g, " ").trim() || "Figure";
  if (!qid || !["question", "explanation", "topic_note"].includes(place) || !window.supabase) {
    return finish("This link is not complete", "Ask Claude for a new one.");
  }

  const sb = window.supabase.createClient(URL_, KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  $("retry").onclick = () => location.reload();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show("signin");
  const uid = session.user.id;

  const load = async () => {
    const { data, error } = await sb.from("generated_questions").select("id, payload").eq("id", qid).eq("user_id", uid).maybeSingle();
    if (error) throw error;
    return data;
  };
  let row;
  try { row = await load(); } catch (e) { return finish("That did not work", e.message); }
  if (!row) return finish("Not your question", "This question is not in your decks. Check you are signed in to the right account.");
  if (place === "topic_note" && !row.payload.topic) return finish("No topic note", "That question has no topic note to add a picture to.");

  $("where").textContent = { question: "It will show above the question.", explanation: "It will show in the explanation.", topic_note: "It will show in the topic note." }[place];
  $("question").textContent = row.payload.q || "";
  show("ask");

  let file = null;
  const take = f => {
    $("err").textContent = "";
    if (!f) return;
    if (!TYPES[f.type]) { $("err").textContent = "That is not a JPEG, PNG or WebP picture."; return; }
    if (f.size > MAX) { $("err").textContent = "That picture is over 4 MB."; return; }
    file = f;
    $("preview").src = URL.createObjectURL(f); $("preview").hidden = false; $("dropText").hidden = true;
    $("save").disabled = false;
  };
  $("file").onchange = e => take(e.target.files[0]);
  const drop = $("drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files[0]); };
  addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])][0]; if (f) take(f); });

  $("save").onclick = async () => {
    $("save").disabled = true; $("err").textContent = "";
    try {
      const path = `${uid}/${crypto.randomUUID()}.${TYPES[file.type]}`;
      const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type, upsert: false });
      if (up.error) throw up.error;
      const fresh = await load();              // the latest text, in case it changed since the page opened
      const p = { ...fresh.payload };
      const fig = `![${caption}](${path})`;
      if (place === "question") p.img = path;
      else if (place === "explanation") p.exp = `${p.exp || ""}\n\n${fig}`.trim();
      else p.topic = { ...p.topic, body: `${p.topic.body}\n\n${fig}` };
      const { error } = await sb.from("generated_questions").update({ payload: p }).eq("id", qid).eq("user_id", uid);
      if (error) throw error;
      finish("Picture added", "It is on the question now. You can close this tab and tell Claude it is done.");
    } catch (e) {
      $("save").disabled = false;
      $("err").textContent = e.message || "That did not work. Try again.";
    }
  };
})();
</script>
</body>
</html>
